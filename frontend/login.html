<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - AI Code Review</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center align-items-center py-4">

  <div class="container" style="max-width: 400px;">
    <!-- Brand Header -->
    <div class="text-center mb-4">
      <a href="index.html" class="brand-logo justify-content-center mb-2">
        <div class="brand-logo-icon">AC</div>
        <span>AI CODE REVIEW</span>
      </a>
      <p class="text-muted small mb-0">Sign in to access repository audits and review history</p>
    </div>

    <!-- Login Card -->
    <div class="card-clean p-4">
      <h5 class="fw-bold mb-3">Sign In</h5>

      <!-- Error Alert Box -->
      <div id="errorAlert" class="alert alert-danger py-2 small d-none" role="alert" style="font-size: 0.8rem;"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label small fw-bold text-muted" style="font-size: 0.72rem; letter-spacing: 0.05em;">EMAIL ADDRESS</label>
          <input type="email" class="form-control" id="email" placeholder="developer@company.com" required autocomplete="email">
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="password" class="form-label small fw-bold text-muted mb-0" style="font-size: 0.72rem; letter-spacing: 0.05em;">PASSWORD</label>
          </div>
          <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="submitBtn" class="btn-olive w-100 justify-content-center py-2 mt-2">
          <span>Sign In</span>
        </button>
      </form>

      <div class="text-center mt-4 pt-3 border-top">
        <p class="small text-muted mb-0">Need an account? <a href="register.html" class="fw-semibold" style="color: var(--primary-olive);">Create account</a></p>
      </div>
    </div>

    <div class="text-center mt-3">
      <a href="index.html" class="small text-muted text-decoration-none">&larr; Return to homepage</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.requireGuest();

      const form = document.getElementById('loginForm');
      const errorAlert = document.getElementById('errorAlert');
      const submitBtn = document.getElementById('submitBtn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorAlert.classList.add('d-none');
        errorAlert.textContent = '';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          errorAlert.textContent = 'Please fill in both email and password.';
          errorAlert.classList.remove('d-none');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

        try {
          const res = await apiClient.post('/api/login', { email, password });
          if (res.success && res.token) {
            Auth.saveAuth(res.token, res.user);
            showToast('Login successful.', 'info');
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 500);
          } else {
            throw new Error(res.error || 'Login failed');
          }
        } catch (err) {
          errorAlert.textContent = err.message || 'Invalid email or password.';
          errorAlert.classList.remove('d-none');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Sign In</span>';
        }
      });
    });
  </script>
</body>
</html>
